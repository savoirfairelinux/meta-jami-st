# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "jami-st"
BBFILE_PATTERN_jami-st = "^${LAYERDIR}/"
BBFILE_PRIORITY_jami-st = "6"

LAYERDEPENDS_jami-st = "core jami"
LAYERSERIES_COMPAT_jami-st = "scarthgap"
